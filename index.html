<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>눈 내리는 밤의 모녀 — 거지모녀 도와주기</title>
<style>
:root{--ol:#3b2a3f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#15111b;font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;color:#2b2230;overscroll-behavior:none;overflow:hidden}
button{font-family:inherit;color:inherit;cursor:pointer;-webkit-user-select:none;user-select:none}
#app{position:relative;max-width:480px;height:100%;height:100dvh;margin:0 auto;overflow:hidden;background:#000;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.screen{position:absolute;inset:0}
.hidden{display:none!important}
#fx{position:absolute;inset:0;z-index:90;pointer-events:none;overflow:hidden}
#modal{position:absolute;inset:0;z-index:80;pointer-events:none}
#modal>*{pointer-events:auto}

/* ============ HOME ============ */
#home{background:#1d2232;overflow:hidden}
.room{position:absolute;inset:0;overflow:hidden}
.wall{position:absolute;left:0;right:0;top:0;height:62%;background:repeating-linear-gradient(90deg,#5d6272 0 44px,#525767 44px 47px);transition:filter 1s}
.wall::after{content:"";position:absolute;left:0;right:0;bottom:0;height:16px;background:#3d3240;border-top:3px solid #2b2230}
.floor{position:absolute;left:0;right:0;bottom:0;height:38%;background:repeating-linear-gradient(0deg,#7a5236 0 30px,#5f3e28 30px 33px);transition:filter 1s}
.room.warm .wall{background:repeating-linear-gradient(90deg,#f2d3a4 0 44px,#e7c38f 44px 47px)}
.room.warm .wall::after{background:#a86b3d;border-color:#7a4a28}
.room.warm .floor{background:repeating-linear-gradient(0deg,#c98a54 0 30px,#b4763f 30px 33px)}
.chill{position:absolute;inset:0;background:linear-gradient(rgba(120,170,255,.55),rgba(60,90,170,.35));pointer-events:none;transition:opacity 1s;z-index:6;mix-blend-mode:multiply}
.icicles{position:absolute;left:0;right:0;top:0;height:60px;z-index:2;transition:opacity 1s}
.glow{position:absolute;border-radius:50%;pointer-events:none;z-index:1}
.spot{position:absolute;transform:translate(-50%,-50%);z-index:3;line-height:1;display:flex;align-items:center;justify-content:center}
.spot .obj{font-size:58px;filter:drop-shadow(0 4px 0 rgba(0,0,0,.35))}
.spot .cold{filter:grayscale(.7) brightness(.8) drop-shadow(0 4px 0 rgba(0,0,0,.35))}
.spot.justfixed{animation:fixpop .6s}
@keyframes fixpop{0%{transform:translate(-50%,-50%) scale(.2)}60%{transform:translate(-50%,-50%) scale(1.25)}100%{transform:translate(-50%,-50%) scale(1)}}
.barrel2{display:flex;flex-direction:column;align-items:center;font-size:58px;filter:drop-shadow(0 4px 0 rgba(0,0,0,.35))}
.barrel2 .f{font-size:46px;margin-bottom:-14px;animation:flick .25s infinite alternate}
@keyframes flick{to{transform:scale(1.08) rotate(3deg)}}
.win{width:30vw;max-width:144px;aspect-ratio:.85;border:7px solid #6b4a32;border-radius:50% 50% 6px 6px/30% 30% 6px 6px;position:relative;overflow:hidden;box-shadow:0 4px 0 rgba(0,0,0,.3)}
.win.broken{background:linear-gradient(#0d1430,#22305a);border-color:#4a3a30}
.win.broken::before{content:"";position:absolute;left:30%;top:0;width:3px;height:60%;background:#cfe3ff;transform:rotate(25deg);transform-origin:top;box-shadow:12px 22px 0 #cfe3ff}
.win.broken::after{content:"";position:absolute;inset:auto 0 0 0;height:42%;background:#6b4a32;clip-path:polygon(0 30%,20% 0,40% 40%,62% 8%,80% 35%,100% 10%,100% 100%,0 100%)}
.win.fixed{background:linear-gradient(#1b2a5a,#3b4f8a)}
.win.fixed .cur{position:absolute;top:0;bottom:0;width:34%;background:repeating-linear-gradient(90deg,#ff8fab 0 6px,#ffb3c6 6px 12px);border-bottom:3px solid #d65a7a}
.win.fixed .cur.l{left:0;border-radius:0 0 60% 0}.win.fixed .cur.r{right:0;border-radius:0 0 0 60%}
.win.fixed .stx{position:absolute;color:#fff6c2;font-size:13px;animation:tw 1.6s infinite alternate}
@keyframes tw{to{opacity:.3}}
.win .wf{position:absolute;width:5px;height:5px;border-radius:50%;background:#fff;animation:blow linear infinite}
@keyframes blow{from{transform:translate(0,-10px)}to{transform:translate(60px,140px)}}
.plaque{background:#fff5df;border:3px solid #8a4b00;border-radius:10px;padding:6px 10px;font-weight:900;font-size:14px;color:#8a4b00;white-space:nowrap;box-shadow:0 4px 0 rgba(0,0,0,.3)}
.drip{position:relative}
.drip::after{content:"💧";position:absolute;left:50%;top:60%;font-size:22px;transform:translateX(-50%);animation:drip 1.2s infinite}
@keyframes drip{from{transform:translate(-50%,0);opacity:1}to{transform:translate(-50%,90px);opacity:0}}
.roomcast{position:absolute;left:50%;bottom:122px;transform:translateX(-50%);display:flex;align-items:flex-end;z-index:4}
.roomcast>div{animation:bob 2.6s ease-in-out infinite}
.roomcast>div:nth-child(2){animation-delay:-1.1s}
.roomcast svg{height:100%;width:auto;display:block;overflow:visible}
#home.scening .roomcast,#home.scening .taskbub{visibility:hidden}
.snowin{position:absolute;inset:0;z-index:5;pointer-events:none}
.flake{position:absolute;top:-10px;width:6px;height:6px;border-radius:50%;background:#fff;opacity:.85;animation:fall linear infinite}
@keyframes fall{to{transform:translate(30px,110vh)}}
.taskbub{position:absolute;transform:translate(-50%,-100%);z-index:8;background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center;animation:bubin .4s}
@keyframes bubin{from{transform:translate(-50%,-100%) scale(.3)}}
.taskbub .ci{width:62px;height:62px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff,#cfe7ff);border:4px solid #2f6fd6;display:grid;place-items:center;font-size:32px;box-shadow:0 4px 0 #1d4a99;animation:bubb 1.2s ease-in-out infinite}
@keyframes bubb{50%{transform:translateY(-5px)}}
.taskbub .cc{margin-top:-10px;background:#2f6fd6;color:#fff;border:3px solid #fff;border-radius:99px;padding:1px 9px;font-weight:900;font-size:14px}
.taskbub .nm{margin-top:3px;background:rgba(0,0,0,.6);color:#fff;font-size:11.5px;font-weight:800;border-radius:8px;padding:2px 7px;white-space:nowrap}
.taskbub .hand{position:absolute;right:-30px;top:30px;font-size:40px;animation:hand .6s infinite alternate;pointer-events:none}
@keyframes hand{to{transform:translate(-6px,-8px)}}
.topbar{position:absolute;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;gap:7px;padding:10px 8px 10px 8px}
.avatar{flex:none;width:46px;height:46px;border-radius:12px;border:3px solid #fff;background:linear-gradient(#ffc2d1,#ff8fab);overflow:hidden;box-shadow:0 3px 0 rgba(0,0,0,.35)}
.avatar svg{width:100%;height:100%;display:block}
.res{flex:1;min-width:0;position:relative;display:flex;align-items:center;justify-content:center;gap:4px;height:32px;margin-left:12px;background:#fdf3e1;border:2.5px solid var(--ol);border-radius:99px;padding:0 6px 0 18px;font-weight:900;font-size:15px;box-shadow:0 3px 0 rgba(0,0,0,.35);white-space:nowrap}
.res .ic{position:absolute;left:-13px;top:50%;transform:translateY(-50%);font-size:28px;filter:drop-shadow(0 2px 0 rgba(0,0,0,.3))}
.res small{font-size:10.5px;color:#7a5c6a;font-weight:800;overflow:hidden;text-overflow:ellipsis}
.res.bump{animation:bump .45s}
@keyframes bump{40%{transform:scale(1.15)}}
.gear{flex:none;width:40px;height:40px;border-radius:50%;background:#3d7be0;border:3px solid #fff;font-size:20px;display:grid;place-items:center;box-shadow:0 3px 0 rgba(0,0,0,.35);padding:0}
.bottombar{position:absolute;bottom:0;left:0;right:0;z-index:20;display:flex;gap:10px;padding:0 12px 18px}
#helpBtn{flex:1;height:86px;display:flex;align-items:center;gap:8px;padding:0 10px;background:linear-gradient(#ffdb6e,#f5a524);border:3px solid #7a4a00;border-radius:22px;box-shadow:0 5px 0 #7a4a00}
#helpBtn .kf{flex:none;width:58px;height:58px;border-radius:50%;background:#ffcf9e;border:3px solid #7a4a00;overflow:hidden}
#helpBtn .kf svg{width:100%;height:100%;display:block}
#helpBtn .ht{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}
#helpBtn b{font-size:26px;color:#6b3a00;text-shadow:0 2px 0 #ffe9a8;line-height:1}
#helpBtn .pb{position:relative;width:100%;height:20px;background:#2a3f8a;border:2px solid #6b3a00;border-radius:99px;overflow:hidden}
#helpBtn .pb i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(#7be04a,#3fae1f);transition:width .6s}
#helpBtn .pb em{position:relative;font-style:normal;color:#fff;font-weight:900;font-size:13px;line-height:16px;text-shadow:0 1px 0 #000}
#playBtn{flex:1;height:86px;font-size:32px;font-weight:900;color:#fff;background:linear-gradient(#9cec5a,#3fae1f);border:3px solid #1d6b0a;border-radius:22px;box-shadow:0 5px 0 #1d6b0a;text-shadow:0 3px 0 #1d6b0a}
#playBtn.pulse,#helpBtn.pulse{animation:hb .9s infinite}
@keyframes hb{50%{transform:scale(1.05)}}
#helpBtn:active,#playBtn:active{transform:translateY(3px);box-shadow:0 2px 0 #1d6b0a}

/* ============ LEVEL ============ */
#level{background:#7a4a2c;display:flex;flex-direction:column}
.lvhead{flex:none;height:112px;position:relative;background:linear-gradient(#150f33,#3a2257 65%,#7a3348);overflow:hidden}
.lights{position:absolute;left:0;top:0;width:100%;height:60px}
.bulb{animation:blink 1.4s infinite alternate}
@keyframes blink{to{opacity:.45}}
.lant{position:absolute;top:22px;font-size:34px;animation:sway 2s ease-in-out infinite alternate;transform-origin:top center}
.lant.l{left:8px}.lant.r{right:8px;animation-delay:-1s}
@keyframes sway{from{transform:rotate(-6deg)}to{transform:rotate(6deg)}}
.lvhead .sign{position:absolute;left:50%;top:34px;transform:translateX(-50%);background:#8a4b1f;border:3px solid #3b2014;color:#ffe1a8;font-weight:900;font-size:16px;padding:4px 14px;border-radius:8px;white-space:nowrap;box-shadow:0 3px 0 #2a150b}
.timer{position:absolute;left:50%;top:72px;transform:translateX(-50%);background:rgba(0,0,0,.5);color:#fff;font-weight:900;font-size:17px;padding:3px 14px;border-radius:99px;border:2px solid rgba(255,255,255,.4)}
.timer.low{color:#ff5a5f;animation:hb .5s infinite}
.combo{position:absolute;left:56px;top:72px;display:flex;align-items:center;gap:6px;color:#fff;font-weight:900;font-size:17px;text-shadow:0 2px 0 #000;opacity:0;transition:opacity .3s}
.combo.on{opacity:1}
.cbar{width:56px;height:10px;background:rgba(0,0,0,.5);border-radius:99px;overflow:hidden}
.cbar i{display:block;height:100%;background:#ff9f1c;width:0}
.pause{position:absolute;right:56px;top:68px;width:38px;height:38px;border-radius:50%;background:#ff8a1f;border:3px solid #3b2014;color:#3b2014;font-weight:900;font-size:13px;box-shadow:0 3px 0 #2a150b;padding:0}
.lvinfo{flex:none;display:flex;justify-content:space-between;align-items:center;padding:6px 16px;background:#5a321c;color:#ffcf8a;font-weight:900;font-size:22px;border-bottom:3px solid #3b2014;text-shadow:0 2px 0 #2a150b}
.board{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,1fr);gap:8px 10px;align-content:center;padding:10px 12px;touch-action:none;background:repeating-linear-gradient(90deg,#7a4a2c 0 60px,#704428 60px 62px)}
.grill{display:flex;flex-direction:column;align-items:center;min-height:0;position:relative}
.rack{position:relative;flex:none;height:var(--rh,96px);width:100%;background-color:#26262b;background-image:repeating-linear-gradient(0deg,transparent 0 10px,#3a3a41 10px 13px);border-radius:12px;border:3px solid #141417;box-shadow:inset 0 0 0 2px #45454d,0 4px 0 #1a1a1e;display:grid;grid-template-columns:repeat(3,1fr);padding:5% 4%}
.slot{position:relative;display:flex;align-items:center;justify-content:center;min-height:0}
.slot svg{height:96%;width:auto;max-width:100%;transition:transform .15s,filter .15s;filter:drop-shadow(0 2px 0 rgba(0,0,0,.35))}
.slot.sel svg{transform:translateY(-7px) scale(1.12);filter:drop-shadow(2px 0 0 #fff) drop-shadow(-2px 0 0 #fff) drop-shadow(0 2px 0 #fff) drop-shadow(0 -2px 0 #fff) drop-shadow(0 4px 4px rgba(0,0,0,.4))}
.slot.lift svg{opacity:.25}
.slot.rise svg{animation:rise .35s}
@keyframes rise{from{transform:translateY(30px) scale(.6);opacity:0}}
.slot.match svg{animation:matchpop .32s forwards}
@keyframes matchpop{40%{transform:scale(1.35) translateY(-8px)}100%{transform:scale(0) translateY(-30px);opacity:0}}
.slot.placed svg{animation:placed .25s}
@keyframes placed{50%{transform:scale(1.15) translateY(-4px)}}
.slot.hintsrc svg,.slot.hintdst{animation:hintg .6s infinite alternate}
.slot.hintdst{border-radius:8px}
@keyframes hintg{to{filter:drop-shadow(0 0 8px #7cff6b);box-shadow:inset 0 0 0 3px #7cff6b}}
.slot.wig svg{animation:shake .35s}
.ice{position:absolute;inset:4% 2%;border-radius:8px;background:linear-gradient(135deg,rgba(220,245,255,.85),rgba(140,205,255,.6));border:2px solid #e8f8ff;box-shadow:inset 0 0 8px #fff;display:flex;align-items:flex-end;justify-content:center;font-size:11px;font-weight:900;color:#1d5c8a;padding-bottom:2px;pointer-events:none}
.lid{position:absolute;inset:-3px;border-radius:12px;background:linear-gradient(#9aa0aa,#5d636e);border:3px solid #2d3038;display:flex;align-items:center;justify-content:center;z-index:2}
.lid::before{content:"";position:absolute;top:18%;left:50%;width:34%;height:16%;transform:translateX(-50%);border:5px solid #2d3038;border-bottom:0;border-radius:12px 12px 0 0}
.lid span{margin-top:18%;background:#fff;border:2px solid #2d3038;border-radius:10px;padding:2px 8px;font-weight:900;font-size:14px}
.lid.open{animation:lidopen .5s forwards}
@keyframes lidopen{to{transform:translateY(-40px) rotate(-20deg);opacity:0}}
.plate{flex:none;width:86%;height:20px;margin-top:-2px;background:#fff;border-radius:50%/60%;border:2px solid #d9d2cc;box-shadow:0 3px 0 #cfc6be,0 6px 0 #ebe5df;display:grid;grid-template-columns:repeat(3,1fr);align-items:end;position:relative}
.plate i{display:flex;justify-content:center;height:100%}
.plate svg{height:28px;margin-top:-16px;opacity:.95}
.plate .more{position:absolute;right:-10px;top:-6px;background:#3b2014;color:#ffcf8a;font-size:10px;border-radius:99px;padding:0 5px;font-style:normal;font-weight:900}
.boosters{flex:none;display:flex;justify-content:space-around;padding:8px 6px 14px;background:#4a2816;border-top:3px solid #3b2014}
.bst{position:relative;width:66px;height:66px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fffaf0,#f3dcb5);border:3px solid #3b2014;box-shadow:0 4px 0 #2a150b;font-size:30px;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.bst small{font-size:10.5px;font-weight:900;color:#6b3a1c;margin-top:2px}
.bst .n{position:absolute;right:-5px;bottom:-5px;min-width:26px;height:26px;padding:0 5px;border-radius:13px;background:#2a9d3f;color:#fff;font-size:13px;font-weight:900;border:2px solid #fff;display:grid;place-items:center}
.bst .n.buy{background:#f4a300;font-size:10px}
.bst:active{transform:translateY(3px);box-shadow:0 1px 0 #2a150b}
.ghost{position:absolute;pointer-events:none;z-index:95;transform:translate(-50%,-60%) scale(1.15);filter:drop-shadow(0 8px 6px rgba(0,0,0,.45))}
.ghost svg{height:100%;width:auto;filter:drop-shadow(2px 0 0 #fff) drop-shadow(-2px 0 0 #fff) drop-shadow(0 2px 0 #fff) drop-shadow(0 -2px 0 #fff) drop-shadow(0 4px 4px rgba(0,0,0,.4))}
.thand{position:absolute;font-size:46px;z-index:96;pointer-events:none;animation:thand 1.6s ease-in-out infinite}
@keyframes thand{0%{transform:translate(var(--x0),var(--y0));opacity:0}15%{opacity:1}70%{transform:translate(var(--x1),var(--y1));opacity:1}100%{transform:translate(var(--x1),var(--y1));opacity:0}}
.lvintro{position:absolute;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(20,10,5,.55);color:#fff;text-align:center;animation:fade .3s}
.lvintro b{font-size:54px;text-shadow:0 4px 0 #3b2014;animation:pop .4s}
.lvintro span{font-size:18px;font-weight:800;margin-top:6px}
.newmenu{display:flex;flex-direction:column;align-items:center;margin-bottom:16px;background:#fff8ec;color:#5a2e1a;border:4px solid #3b2014;border-radius:22px;padding:12px 28px 14px;box-shadow:0 6px 0 #3b2014;animation:pop .45s}
.newmenu em{font-style:normal;font-weight:900;font-size:16px;color:#e63946}
.newmenu i{display:block;height:110px;margin:6px 0;animation:wig .5s infinite alternate}
.newmenu i svg{height:100%;width:auto}
.newmenu strong{font-size:24px;font-weight:900}
@keyframes wig{to{transform:rotate(-6deg) scale(1.06)}}

/* 하드 레벨 · 양념 판 */
#level.hard .board{background:repeating-linear-gradient(90deg,#7a2c1c 0 60px,#6e2618 60px 62px)}
#level.hard .lvhead{background:linear-gradient(#2a0a0a,#6a1a14 65%,#b8321e)}
#level.hard .lvinfo{background:#5a1a10;color:#ffb38a}
.grill.sauce .rack{background-color:#3a1a16;background-image:radial-gradient(circle at 22% 30%,rgba(205,40,20,.8) 0 8px,transparent 9px),radial-gradient(circle at 72% 58%,rgba(205,40,20,.75) 0 11px,transparent 12px),radial-gradient(circle at 46% 86%,rgba(185,30,15,.75) 0 6px,transparent 7px),radial-gradient(circle at 88% 18%,rgba(185,30,15,.7) 0 5px,transparent 6px),repeating-linear-gradient(0deg,transparent 0 10px,#5a2a22 10px 13px);border-color:#5a1208}
.chili{position:absolute;left:3px;top:1px;font-size:13px;z-index:1;pointer-events:none}
.sq{display:grid;place-items:center;width:18px;height:18px;margin-top:-9px;border-radius:50%;background:#c1121f;color:#fff;font-weight:900;font-size:11px;border:2px solid #3b2a3f}
.hardtag{font-size:20px!important;font-weight:900;color:#ffb38a;background:#8a1a10;border:3px solid #fff;border-radius:12px;padding:2px 14px;margin-top:8px!important}
/* 주문 철판 */
.lid.iron{background:radial-gradient(circle at 9px 9px,#9aa1ac 0 3px,transparent 4px),radial-gradient(circle at calc(100% - 9px) 9px,#9aa1ac 0 3px,transparent 4px),radial-gradient(circle at 9px calc(100% - 9px),#9aa1ac 0 3px,transparent 4px),radial-gradient(circle at calc(100% - 9px) calc(100% - 9px),#9aa1ac 0 3px,transparent 4px),repeating-linear-gradient(135deg,#4a4f58 0 8px,#40454e 8px 16px);border-color:#15171b;flex-direction:column}
.lid.iron::before{display:none}
.lid.iron .tag{font-style:normal;font-size:10px;font-weight:900;color:#e3e7ee;margin-bottom:2px}
.lid.iron .req{margin-top:0;display:flex;align-items:center;gap:2px;padding:1px 6px;font-size:12px}
.lid.iron .req i{height:28px;display:block}.lid.iron .req i svg{height:100%;width:auto}
/* 손님 주문 */
.order{position:absolute;left:50%;top:12px;transform:translateX(-50%);display:flex;align-items:center;gap:6px;background:#fff8ec;border:3px solid #3b2014;border-radius:14px;padding:2px 10px 3px 6px;box-shadow:0 3px 0 #2a150b;z-index:3;animation:ordin .45s cubic-bezier(.3,1.4,.6,1);white-space:nowrap}
.order.hidden{display:none}
@keyframes ordin{from{left:140%}}
.order.leave{transition:left .45s ease-in,opacity .45s;left:-60%;opacity:0}
.order .cu{font-size:28px;line-height:1}
.order .oi{display:flex;gap:8px}
.order .oi b{display:flex;align-items:center;gap:1px;font-size:12px;font-weight:900;color:#5a2e1a}
.order .oi b i{height:26px;display:block}.order .oi b i svg{height:100%;width:auto}
.order .oi b.sc{position:relative;background:#ffe1dc;border:2px solid #c1121f;border-radius:9px;padding:0 4px;color:#a3121a}
.order .oi b.sc u{position:absolute;left:50%;top:-9px;transform:translateX(-50%);text-decoration:none;font-size:9px;font-weight:900;background:#c1121f;color:#fff;border-radius:6px;padding:0 4px;white-space:nowrap}
.order .oi b.ok{color:#2a9d3f}.order .oi b.ok i{opacity:.55}
.obar{display:block;height:5px;background:#e3d5c2;border-radius:9px;overflow:hidden;margin-top:2px}
.obar i{display:block;height:100%;background:#3fae1f;transform-origin:left}
.order.hurry .obar i{background:#ff5a5f}
.order.hurry{animation:hb .5s infinite}
.lvhead .sign{transition:opacity .3s}
.lvhead.ordering .sign{opacity:0}
/* 레일 */
.railbox{flex:none;height:64px;position:relative;background:#2f2f35;border-top:4px solid #1a1a1e;border-bottom:4px solid #1a1a1e;overflow:hidden;touch-action:none;box-shadow:inset 0 6px 8px rgba(0,0,0,.4)}
.belt{position:absolute;left:0;right:0;top:44px;height:12px;background:repeating-linear-gradient(90deg,#55555e 0 16px,#3d3d45 16px 22px);border-top:2px solid #1a1a1e}
.ritems{position:absolute;inset:0}
.ritem{position:absolute;left:0;top:2px;width:46px;height:54px;display:flex;justify-content:center;will-change:transform;cursor:grab}
.ritem svg{height:100%;width:auto;filter:drop-shadow(0 2px 0 rgba(0,0,0,.4));transition:transform .15s}
.ritem.sel svg{transform:translateY(-3px) scale(1.08);filter:drop-shadow(2px 0 0 #fff) drop-shadow(-2px 0 0 #fff) drop-shadow(0 2px 0 #fff) drop-shadow(0 -2px 0 #fff)}
.ritem.lift svg{opacity:.25}
.ritem.hintsrc svg{animation:hintg .6s infinite alternate}
/* ============ SCENE ============ */
#scene{z-index:50}
.stage{position:absolute;inset:0;transition:filter .6s,background .6s;--fl:180px}
.stage::after{content:"";position:absolute;left:0;right:0;bottom:0;height:var(--fl);background:var(--floor,#333);border-top:3px solid rgba(0,0,0,.18);transition:height .4s}
.decor{position:absolute;inset:0;z-index:1;pointer-events:none}
.cast{position:absolute;left:0;right:0;bottom:180px;z-index:3;display:flex;justify-content:center;align-items:flex-end;pointer-events:none;transition:bottom .4s}
#scene[data-mode=clean] .cast{pointer-events:auto}
.cast svg{pointer-events:none}
.cast .dirt{pointer-events:all}
.ch{transition:filter .3s,transform .3s;animation:bob 2.6s ease-in-out infinite;transform-origin:bottom center}
.ch:nth-child(2){animation-delay:-.7s}.ch:nth-child(3){animation-delay:-1.3s}.ch:nth-child(4){animation-delay:-1.9s}
.ch svg{display:block;height:100%;width:auto;overflow:visible}
.ch.dim{filter:brightness(.72) saturate(.8)}
.ch.speak{transform:translateY(-6px) scale(1.03)}
@keyframes bob{0%,100%{translate:0 0}50%{translate:0 -3px}}
.tear{animation:tear 1.1s ease-in infinite}.t2{animation-delay:.5s}
@keyframes tear{0%{transform:translateY(0);opacity:1}100%{transform:translateY(10px);opacity:0}}
.dirt{cursor:pointer;transition:opacity .3s,transform .3s;transform-box:fill-box;transform-origin:center}
.dirt.gone{opacity:0;transform:scale(1.8)}
#scene[data-mode=clean] .dirt ellipse{animation:pulse 1.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{50%{transform:scale(1.15)}}
#sui{position:absolute;inset:0;z-index:10}
.bg-room{background:linear-gradient(rgba(10,10,30,.1),rgba(10,10,30,.55));--floor:transparent}
.bg-room.stage::after{border:0}
.bg-mansion{background:linear-gradient(#070d22,#1b2a52 55%,#2b2440);--floor:#231c30}
.bg-snow{background:linear-gradient(#141c2c,#344662 60%,#566984);--floor:#e9eff7}
.bg-shop{background:linear-gradient(#ffd3e6,#fff1f7);--floor:#ecc8d9}
.bg-bakery{background:linear-gradient(#a9dcff,#fff3df 70%);--floor:#e3cca8}
.bg-gold{background:radial-gradient(circle at 50% 28%,#fff6c2,#ffcf57 48%,#e98f0c);--floor:#cf7a06}
.d{position:absolute;line-height:1}
.mansion{position:absolute;left:10%;right:10%;top:15%;height:32%;background:#121834;border:3px solid #0a0d1c;display:grid;grid-template-columns:repeat(3,1fr);gap:12%;padding:9% 11%}
.mansion i{background:linear-gradient(#fff0b8,#ffb84d);box-shadow:0 0 20px #ffb84d;border-radius:3px}
.mansion::before{content:"";position:absolute;left:-8%;right:-8%;top:-24%;height:25%;background:#0c1128;clip-path:polygon(6% 100%,50% 0,94% 100%)}
.lamp{position:absolute;right:12%;bottom:var(--fl);width:8px;height:52%;background:#1d2533}
.lamp::before{content:"";position:absolute;left:-14px;top:-10px;width:36px;height:16px;border-radius:8px 8px 3px 3px;background:#1d2533}
.lamp::after{content:"";position:absolute;left:-60px;top:0;width:128px;height:128px;border-radius:50%;background:radial-gradient(rgba(255,226,140,.45),transparent 65%)}
.pocha{position:absolute;left:6%;top:16%;width:46%;height:26%;background:#ff7b3a;border:3px solid #3b2014;border-radius:14px 14px 4px 4px;box-shadow:0 0 40px rgba(255,140,60,.7)}
.pocha::after{content:"포장마차";position:absolute;inset:0;display:grid;place-items:center;font-weight:900;color:#fff4d6;font-size:20px}
.rail{position:absolute;left:6%;right:6%;top:16%;border-top:5px solid #b98aa3;display:flex;justify-content:space-around;font-size:clamp(40px,12vw,58px)}
.rail span{margin-top:4px}
.awning{position:absolute;left:-5%;right:-5%;top:-10%;height:30%;background:repeating-linear-gradient(90deg,#e63946 0 26px,#fff 26px 52px);border:3px solid var(--ol);border-radius:10px 10px 18px 18px}
.store{position:absolute;left:6%;right:6%;top:9%;height:36%;background:#fffdf7;border:3px solid var(--ol);border-radius:8px}
.store .awning{background:repeating-linear-gradient(90deg,#f4a300 0 26px,#fff4cc 26px 52px)}
.store .sign{position:absolute;left:50%;top:34%;transform:translateX(-50%);text-align:center;font-weight:900;font-size:clamp(20px,6vw,28px);color:#8a4b00;white-space:nowrap;line-height:1.25}
.store .sign small{display:block;font-size:13px;color:#b86e00}
.conf{position:absolute;top:-12px;width:9px;height:14px;animation:fall linear infinite}
.dlg{position:absolute;left:10px;right:10px;bottom:14px;min-height:118px;background:#fdf6ea;border:3px solid #c9a77a;border-radius:18px;padding:24px 16px 26px;font-size:17px;font-weight:700;color:#5a2e1a;line-height:1.6;box-shadow:0 6px 0 rgba(0,0,0,.35);word-break:keep-all}
.dlg .who{position:absolute;top:-17px;left:16px;color:#fff;padding:4px 18px;border-radius:8px 8px 8px 2px;font-weight:900;font-size:15px;border:2px solid #fff;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.dlg.narr{background:rgba(18,14,26,.92);color:#fff;text-align:center;display:flex;align-items:center;justify-content:center;border-color:#555}
.dlg.narr .who{display:none}
.dlg .nx{position:absolute;right:16px;bottom:8px;font-size:13px;color:#c9a77a;animation:nx .8s infinite alternate}
@keyframes nx{to{transform:translateY(3px)}}
.skip{position:absolute;top:62px;right:12px;z-index:12;background:rgba(0,0,0,.45);color:#fff;border:0;border-radius:999px;padding:7px 13px;font-size:12px;font-weight:800}
.q{position:absolute;top:18px;left:12px;right:12px;z-index:5;background:#fff;border:3px solid var(--ol);border-radius:16px;padding:12px 14px;font-weight:900;font-size:17px;text-align:center;box-shadow:0 5px 0 rgba(0,0,0,.28);animation:pop .35s;word-break:keep-all;line-height:1.4}
.q .sub{font-size:13px;font-weight:700;color:#8a6f7d;margin-top:3px}
@keyframes pop{from{transform:scale(.7);opacity:0}}
.cards{position:absolute;left:10px;right:10px;bottom:16px;height:34%;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{position:relative;background:#fff;border:3px solid var(--ol);border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-size:15px;font-weight:900;padding:10px;box-shadow:0 6px 0 var(--ol);text-align:center;line-height:1.35;word-break:keep-all;animation:pop .4s}
.card .e{font-size:clamp(50px,15vw,74px);line-height:1}
.card:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ol)}
.card.ok{background:#d9f7cf;border-color:#2a9d3f}
.card.bad{background:#ffd3d3;animation:shake .45s}
.card .mk{position:absolute;top:-8px;right:-8px;font-size:40px;animation:pop .3s}
.card .hand{position:absolute;bottom:-6px;right:6px;font-size:42px;animation:hand .6s infinite alternate;pointer-events:none}
.vs{position:absolute;left:50%;bottom:calc(34% + 4px);transform:translate(-50%,50%);z-index:2;background:#ff5a5f;color:#fff;font-weight:900;border:3px solid var(--ol);border-radius:50%;width:46px;height:46px;display:grid;place-items:center;font-size:15px;pointer-events:none}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
@keyframes fade{from{opacity:0}}
.big{background:#ff5a5f;color:#fff;font-weight:900;font-size:18px;border:3px solid var(--ol);border-radius:16px;padding:13px 26px;box-shadow:0 5px 0 var(--ol)}
.big:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ol)}
.big:disabled{background:#bdb2b8;box-shadow:0 5px 0 #8a7f86;border-color:#8a7f86}
.big.green{background:#3fae1f}.big.blue{background:#3d7be0}.big.gray{background:#8d8189}
.failov{position:absolute;inset:0;z-index:30;background:rgba(36,0,10,.86);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;color:#fff;text-align:center;animation:fade .35s}
.failov .fc{display:flex;align-items:flex-end;filter:grayscale(.5)}
.failov h1{font-size:58px;color:#ff4d6d;margin:10px 0 4px;text-shadow:0 4px 0 #000;animation:shake .5s}
.failov p{font-size:17px;line-height:1.6;font-weight:700;margin:0 0 26px;word-break:keep-all}
.panel{position:absolute;left:10px;right:10px;bottom:14px;background:#fff;border:3px solid var(--ol);border-radius:20px;padding:12px;box-shadow:0 6px 0 var(--ol)}
.tabs{display:flex;gap:8px;margin-bottom:10px}
.tabs button{flex:1;border:3px solid var(--ol);border-radius:12px;background:#f6eef2;padding:8px;font-weight:900;font-size:15px}
.tabs button.on{background:#ff8fab;color:#fff}
.tabs .ck{color:#2a9d3f}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.opt{border:3px solid #e3d5dc;border-radius:14px;background:#fffafc;padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:800;font-size:12.5px;word-break:keep-all;text-align:center;line-height:1.3}
.opt svg{height:96px;width:auto}
.opt.on{border-color:#ff5a8a;background:#ffe3ec;box-shadow:0 0 0 2px #ff5a8a}
.panel .big{width:100%}
.endcard{position:absolute;left:12px;right:12px;bottom:14px;background:#fffdf5;border:3px solid var(--ol);border-radius:20px;padding:16px;box-shadow:0 6px 0 var(--ol);text-align:center;animation:pop .5s}
.endcard .tag{display:inline-block;background:#3b2a3f;color:#ffd166;font-weight:900;letter-spacing:.2em;font-size:12px;padding:3px 12px;border-radius:99px}
.endcard h2{margin:8px 0 8px;font-size:25px}
.endcard ul{list-style:none;padding:0;margin:0 0 10px;font-weight:800;font-size:14px;line-height:1.75;text-align:left;display:inline-block}
.endcard .epi{font-size:13.5px;color:#6b5a63;margin:0 0 14px;line-height:1.55;word-break:keep-all}

/* ============ MODAL / FX ============ */
.mwrap{position:absolute;inset:0;background:rgba(10,6,16,.6);display:flex;align-items:center;justify-content:center;padding:20px;animation:fade .25s}
.mcard{width:100%;max-width:360px;background:#fff8ec;border:4px solid var(--ol);border-radius:24px;box-shadow:0 8px 0 var(--ol);padding:0 18px 20px;text-align:center;position:relative;animation:pop .3s}
.mcard .mt{margin:-22px auto 12px;display:inline-block;background:#3d7be0;color:#fff;font-weight:900;font-size:20px;padding:8px 26px;border-radius:14px;border:3px solid var(--ol);box-shadow:0 4px 0 var(--ol)}
.mcard p{font-size:15px;font-weight:700;line-height:1.6;margin:6px 0 14px;word-break:keep-all;color:#5a3a4a}
.mcard .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.mcard .row .big{flex:1;min-width:120px;font-size:16px;padding:12px 10px}
.mcard .stars{font-size:52px;letter-spacing:6px;margin:6px 0}
.mcard .stars .off{filter:grayscale(1) opacity(.35)}
.mcard .rew{display:flex;gap:10px;justify-content:center;margin-bottom:14px}
.mcard .rew span{background:#fff;border:2.5px solid var(--ol);border-radius:99px;padding:6px 14px;font-weight:900;font-size:17px}
.tlist{max-height:46vh;overflow:auto;text-align:left;margin:0 0 14px;padding:0;list-style:none}
.tlist li{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:12px;font-weight:800;font-size:14px;margin-bottom:5px;background:#f3e9da}
.tlist li.done{opacity:.55;text-decoration:line-through}
.tlist li.cur{background:#dbeaff;border:2px solid #3d7be0}
.tlist li .c{margin-left:auto;font-size:13px;white-space:nowrap}
.title{position:absolute;inset:0;z-index:85;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:12% 16px 46px;background:linear-gradient(#141c2c,#344662 60%,#566984);overflow:hidden}
.title .tc{text-align:center;color:#fff;position:relative;z-index:2;animation:pop .6s}
.title .sub{font-size:15px;font-weight:800;letter-spacing:.3em;opacity:.85}
.title h1{margin:8px 0 10px;font-size:clamp(34px,11vw,50px);line-height:1.12;font-weight:900;text-shadow:0 4px 0 #3b2a3f,0 0 24px rgba(255,180,220,.6)}
.title h1 em{font-style:normal;color:#ffd166}
.badge{display:inline-block;background:#06d6a0;color:#073b2c;font-weight:900;font-size:13px;border-radius:999px;padding:5px 12px;border:2px solid #073b2c;transform:rotate(-3deg)}
.title .tcast{position:relative;z-index:2;display:flex;align-items:flex-end}
.title .tcast svg{height:100%;width:auto;display:block}
.title .big{position:relative;z-index:2;font-size:20px;animation:hb 1.1s infinite}
.toast{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);z-index:45;background:#fff;border:3px solid var(--ol);border-radius:18px;padding:12px 20px;font-size:19px;font-weight:900;box-shadow:0 6px 0 var(--ol);white-space:nowrap;animation:toast 1.5s forwards;pointer-events:none}
@keyframes toast{0%{transform:translate(-50%,-50%) scale(.4);opacity:0}15%{transform:translate(-50%,-50%) scale(1.08);opacity:1}25%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-70%)}}
.spark{position:absolute;font-size:22px;animation:spark .8s forwards}
@keyframes spark{to{transform:translate(var(--dx),var(--dy)) scale(.3);opacity:0}}
.float{position:absolute;font-weight:900;font-size:18px;color:#fff;text-shadow:0 2px 0 #3b2a3f,0 0 4px #3b2a3f;animation:flt 1s forwards;white-space:nowrap}
@keyframes flt{to{transform:translateY(-50px);opacity:0}}
.slot.collected svg{opacity:0}
.cflyer{position:absolute;z-index:92;pointer-events:none;transition:transform .2s ease-in}
.cflyer svg{height:100%;width:auto;display:block;margin:0 auto}
.platepack{position:absolute;z-index:92;pointer-events:none;animation:platein .16s ease-out}
@keyframes platein{from{transform:scale(.5);opacity:0}}
.platepack>svg{position:absolute;left:0;right:0;bottom:4%;width:100%;height:auto}
.platepack.thud>svg{animation:thud .12s}
@keyframes thud{50%{transform:translateY(2px) scaleY(.94)}}
.platepack.go{transition:transform .45s cubic-bezier(.5,-0.4,.7,1),opacity .45s}
.onplate{position:absolute;display:flex;justify-content:center;transform-origin:center}
.onplate svg{height:100%;width:auto;filter:drop-shadow(0 2px 0 rgba(0,0,0,.3))}
.flyer{position:absolute;z-index:92;width:34px;height:60px;transition:transform .55s cubic-bezier(.5,-0.3,.7,1),opacity .55s}
.flyer svg{height:100%;width:auto}

/* ==== 에셋 이미지 ==== */
.rack{background:var(--i-grill) center/100% 100% no-repeat!important;border:0!important;box-shadow:none!important;border-radius:0!important;padding:calc(var(--rh)*.05) 14% calc(var(--rh)*.07)!important}
.grill.sauce .rack{background-image:var(--i-sauce)!important;background-color:transparent!important}
.chili{display:none!important}
.lid{inset:0!important;background:var(--i-lid) center bottom/contain no-repeat!important;border:0!important;border-radius:0!important}
.lid::before{display:none!important}
.lid span{position:absolute;left:47%;top:57%;transform:translate(-50%,-50%);margin:0!important;background:none!important;border:0!important;padding:0!important;font-size:calc(var(--rh)*.22)!important;font-weight:900;color:#3b2a3f}
.lid.iron{background:var(--i-iron) center/contain no-repeat!important}
.lid.iron .tag{display:none!important}
.lid.iron .req{position:absolute;left:50%;top:27%;transform:translate(-50%,-50%);display:flex;align-items:center;gap:2px;font-size:calc(var(--rh)*.13)!important;color:#3b2a3f;white-space:nowrap}
.lid.iron .req i{height:calc(var(--rh)*.24)!important}
.plate{background:var(--i-stack) center/100% 100% no-repeat!important;border:0!important;box-shadow:none!important;border-radius:0!important;width:74%!important;height:calc(var(--rh)*.36)!important;margin-top:-3px!important}
.plate{align-items:center!important}
.plate i{align-items:center;height:100%}
.plate svg{height:calc(var(--rh)*.27)!important;margin-top:0!important;opacity:1!important;transform:rotate(-38deg)}
.plate .sq{margin-top:0!important}
.ice{background:var(--i-ice) center/100% 100% no-repeat!important;border:0!important;box-shadow:none!important;inset:2% 4%!important}
.railbox{background:#3a3a41!important;border:0!important;box-shadow:none!important}
.belt{top:0!important;height:100%!important;border:0!important;background:var(--i-belt) 0 0/auto 100% repeat-x!important}
.bst .bi{width:34px;height:34px;object-fit:contain;display:block}
.ico{height:1.15em;width:auto;vertical-align:-.2em}
.mcard .stars .ico{height:52px}
.res .ic img{width:30px;height:30px;object-fit:contain;display:block}

/* ==== 손님 카운터 ==== */
.counter{flex:none;height:96px;position:relative;overflow:hidden;background:linear-gradient(#5b3a2a,#7a4f36);border-top:3px solid #3b2014}
.counter::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.04) 0 40px,transparent 40px 80px)}
.ledge{position:absolute;left:0;right:0;bottom:0;height:18px;background:linear-gradient(#e0a86e,#c98a54);border-top:3px solid #3b2014;box-shadow:0 -2px 0 rgba(255,255,255,.25) inset;z-index:2}
.lvhead.ordering .sign{opacity:1!important}
.order{position:absolute;left:8px;right:8px;top:6px;bottom:0;transform:none;display:flex;align-items:flex-end;gap:6px;background:none;border:0;box-shadow:none;padding:0;animation:custin .45s cubic-bezier(.3,1.3,.6,1);white-space:normal}
.order.hidden{display:none!important}
@keyframes custin{from{transform:translateX(-110%)}}
.order.leave{transition:transform .45s ease-in,opacity .45s;transform:translateX(-110%);opacity:0}
.order .cust{flex:none;width:74px;height:86px;position:relative;z-index:1;display:flex;align-items:flex-end;justify-content:center}
.order .cu{font-size:62px!important;line-height:1;margin-bottom:6px;filter:drop-shadow(0 3px 0 rgba(0,0,0,.3))}
.order .cu img{height:86px;width:auto;display:block}
.order .ob{position:relative;z-index:3;align-self:center;margin-bottom:12px;background:#fffdf7;border:3px solid #3b2014;border-radius:14px;padding:5px 8px 5px;box-shadow:0 3px 0 #2a150b;display:flex;flex-direction:column;gap:3px;min-width:120px}
.order .ob::before{content:"";position:absolute;left:-11px;top:50%;width:14px;height:14px;background:#fffdf7;border-left:3px solid #3b2014;border-bottom:3px solid #3b2014;transform:translateY(-50%) rotate(45deg)}
.order .oi{display:flex;gap:6px!important}
.order .oi b{position:relative;display:flex!important;align-items:center;justify-content:center;width:46px;height:46px;border-radius:10px;background:#f0e2cc;border:0!important;padding:0!important;font-size:11px!important}
.order .oi b i{height:40px!important;display:block}.order .oi b i svg{height:100%;width:auto;transform:rotate(-25deg)}
.order .oi b em{position:absolute;right:-5px;bottom:-5px;background:#3b2014;color:#fff;font-style:normal;font-weight:900;font-size:11px;border-radius:8px;padding:0 4px;line-height:15px}
.order .oi b.sc{background:#ffb3ad!important}
.order .oi b.sc u{position:absolute!important;left:-4px!important;top:-8px!important;transform:none!important;background:none!important;padding:0!important;font-size:15px!important}
.order .oi b.ok{opacity:.55}.order .oi b.ok em{background:#2a9d3f}
.order .obot{display:flex;align-items:center;gap:6px}
.order .obar{flex:1;display:block;height:7px;background:#e3d5c2;border-radius:9px;overflow:hidden;margin:0!important}
.order .obar i{display:block;height:100%;background:#3fae1f;transform-origin:left}
.order.hurry .obar i{background:#ff5a5f}
.order.hurry{animation:none!important}
.order.hurry .ob{animation:hb .5s infinite}
.order .otime{text-decoration:none;font-weight:900;font-size:12px;color:#5a2e1a;min-width:28px;text-align:right}
.order .ox{position:absolute;right:-9px;top:-9px;width:22px;height:22px;border-radius:50%;background:#ff5a5f;color:#fff;border:2px solid #3b2014;font-size:11px;font-weight:900;padding:0;line-height:1}

/* 레일 크게 */
.railbox{height:100px!important}
.ritem{width:64px!important;height:84px!important;top:8px!important}

/* 잠금 뚜껑·철판 틀 안으로, 불빛, 얼음 단계 */
.lid{inset:0!important;background:none!important;display:flex!important;align-items:center;justify-content:center;flex-direction:row!important}
.lid .lw{position:relative;width:80%;aspect-ratio:1.44;background:var(--i-lid) center/100% 100% no-repeat;margin-top:3%}
.lid.iron .lw{aspect-ratio:1.661;width:84%;background-image:var(--i-iron)}
.lid span{left:49.7%!important;top:56.3%!important}
.lid.iron .req{left:49.8%!important;top:30.5%!important}
.rack{background:var(--i-grill) center/100% 100% no-repeat,radial-gradient(ellipse 70% 75% at 50% 62%,rgba(255,128,44,.6),rgba(160,44,16,.5) 45%,#1f1b1f 82%) 50% 57.6%/72.8% 65.3% no-repeat!important}
.grill.sauce .rack{background:var(--i-sauce) center/100% 100% no-repeat,radial-gradient(ellipse 70% 75% at 50% 62%,rgba(255,128,44,.6),rgba(160,44,16,.5) 45%,#1f1b1f 82%) 50% 57.6%/72.8% 65.3% no-repeat!important}
.rack::after{content:"";position:absolute;left:14%;right:14%;top:21%;bottom:15%;border-radius:12%;pointer-events:none;background:radial-gradient(ellipse at 50% 75%,rgba(255,150,60,.32),transparent 70%);mix-blend-mode:screen;animation:fireglow 2.4s ease-in-out infinite alternate;z-index:1}
@keyframes fireglow{0%{opacity:.35}35%{opacity:.75}65%{opacity:.45}100%{opacity:.85}}
.grill.lk .rack::after{display:none}
.grill.lk .slot{visibility:hidden}
.ice{font-size:0!important;transition:opacity .4s}
.ice.i1{opacity:.5}
.ice.i1::after{content:"💧";position:absolute;right:0;bottom:2px;font-size:11px}

/* 새 잠금 뚜껑 */
.lid .lw{width:100%!important;aspect-ratio:1.473!important;margin-top:0!important}
.lid.iron .lw{aspect-ratio:1.475!important}
.lid span{left:49.7%!important;top:58.9%!important;font-size:calc(var(--rh)*.27)!important}
.lid.iron .req{left:49.7%!important;top:61%!important;gap:1px!important}
.lid.iron .req i{height:calc(var(--rh)*.29)!important}

/* 접시 꼬치·주문 뚜껑 아이콘 크게 */
.plate svg{height:calc(var(--rh)*.33)!important}
.lid.iron .req i{height:calc(var(--rh)*.36)!important}

/* 불판 연기 */
.smoke{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.7),rgba(255,255,255,.25) 45%,rgba(255,255,255,0) 70%);filter:blur(2px);pointer-events:none;opacity:0;animation:smokeup 2.7s ease-out forwards;z-index:89}
@keyframes smokeup{0%{opacity:0;transform:translate(0,0) scale(.45)}25%{opacity:.65}100%{opacity:0;transform:translate(var(--dx),-60px) scale(1.55)}}

/* 포장마차 배경 */
.topzone{flex:none;position:relative;background:#d8472b var(--i-pocha) center 0/100% auto no-repeat}
.topzone>*{position:relative;z-index:1}
.topzone::before{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;background:linear-gradient(rgba(30,10,20,.25),rgba(30,10,20,0) 40%)}
#level.hard .topzone::before{background:linear-gradient(rgba(90,0,0,.45),rgba(120,0,0,.3))}
.lvhead{background:none!important;overflow:visible!important}
.lvhead .lights,.lvhead .lant{display:none!important}
.lvinfo{background:rgba(48,20,10,.62)!important;border-bottom:0!important;border-top:0!important}
#level.hard .lvinfo{background:rgba(70,10,6,.7)!important}
.counter{background:none!important;border-top:0!important}
.counter::before{display:none!important}
.ledge{background:linear-gradient(#eaa86a,#d68a52)!important;border-top:3px solid #4a2414!important}

/* 상단 정리: 레벨·코인 줄 제거, 판매 수 좌상단, 아이템 3개 작게 */
.lvinfo{display:none!important}
.lvhead{height:72px!important}
.lvhead .sign{top:8px!important}
.timer{top:43px!important}
.pause{top:8px!important;right:10px!important}
#servTxt{position:absolute;left:10px;top:9px;z-index:2;background:rgba(48,20,10,.66);color:#ffcf8a;font-weight:900;font-size:16px;padding:3px 11px;border-radius:99px;display:flex;align-items:center;gap:4px;white-space:nowrap;transition:transform .15s;text-shadow:0 2px 0 #2a150b}
.combo{left:10px!important;top:46px!important;font-size:13px!important}
.counter{height:88px!important}
.boosters{padding:5px 8px 8px!important;justify-content:center!important;gap:26px}
.bst{width:50px!important;height:50px!important}
.bst .bi{width:27px!important;height:27px!important}
.bst small{font-size:9px!important;margin-top:0!important}
.bst .n{min-width:20px!important;height:20px!important;font-size:11px!important;right:-6px!important;bottom:-4px!important}
.bst[data-b="hint"]{display:none!important}

const REGEN=15*60*1000;
function tickHearts(){
  if(G.hearts>=5){G.heartT=Date.now();return;}
  const n=Math.floor((Date.now()-G.heartT)/REGEN);
  if(n>0){G.hearts=Math.min(5,G.hearts+n);G.heartT+=n*REGEN;if(G.hearts>=5)G.heartT=Date.now();save();}

let AC=null;
function sfx(k){
  if(k==='pick'||k==='swish'||k==='clink'){sfx2(k);return;}
  if(!G.sound)return;
  try{
    if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();
    const seq={bell:[[1319,.09],[1568,.16]],ok:[[784,.07],[1047,.07],[1319,.16]],tap:[[660,.05]],place:[[520,.06],[780,.06]],match:[[660,.07],[880,.07],[1175,.12]],win:[[523,.12],[659,.12],[784,.12],[1047,.3]],fail:[[330,.18],[247,.3]],buy:[[880,.06],[1320,.1]],err:[[200,.12]]}[k]||[[440,.05]];
    let t=AC.currentTime;
    seq.forEach(([f,d])=>{const o=AC.createOscillator(),g=AC.createGain();o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(.12,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d+.02);t+=d*.8;});
  }catch(e){}
}

let noiseBuf=null;
function ensureNoise(){if(!noiseBuf){const len=Math.floor(AC.sampleRate*1.8);noiseBuf=AC.createBuffer(1,len,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<len;i++){let v=Math.random()*2-1;if(Math.random()<.003)v*=3.5;d[i]=v*.5;}}}
function tone(type,f0,f1,t,d,vol){const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f0,t);if(f1)o.frequency.exponentialRampToValueAtTime(f1,t+d);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d+.02);}
function noiseHit(t,d,freq,vol){const src=AC.createBufferSource();src.buffer=noiseBuf;const bp=AC.createBiquadFilter();bp.type='bandpass';bp.frequency.value=freq;bp.Q.value=1.4;const g=AC.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);src.connect(bp).connect(g).connect(AC.destination);src.start(t,Math.random()*1.2);src.stop(t+d+.02);}
function sfx2(k){
  if(!G.sound)return false;
  try{
    if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended')AC.resume();
    ensureNoise();const t=AC.currentTime;
    if(k==='pick'){tone('sine',520,1150,t,.05,.16);tone('square',2300,1700,t+.045,.025,.05);return true;}
    if(k==='swish'){[0,.04,.08,.12,.16].forEach((dt,i)=>noiseHit(t+dt,.05,2600+i*450,.13-i*.015));return true;}
    if(k==='clink'){tone('sine',2093,0,t,.28,.07);tone('sine',3136,0,t+.01,.2,.04);tone('triangle',1047,0,t,.12,.05);return true;}
  }catch(e){}
  return false;
}

function sizzle(){
  if(!G.sound)return;
  try{
    if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended')AC.resume();
    ensureNoise();
    const src=AC.createBufferSource();src.buffer=noiseBuf;src.playbackRate.value=.9+Math.random()*.25;
    const hp=AC.createBiquadFilter();hp.type='highpass';hp.frequency.value=2400;
    const pk=AC.createBiquadFilter();pk.type='peaking';pk.frequency.value=5200+Math.random()*1500;pk.Q.value=.8;pk.gain.value=7;
    const g=AC.createGain();const t=AC.currentTime,dur=.9+Math.random()*.4;
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.055,t+.05);g.gain.exponentialRampToValueAtTime(.025,t+dur*.45);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    src.connect(hp).connect(pk).connect(g).connect(AC.destination);src.start(t,Math.random()*.3);src.stop(t+dur+.05);
  }catch(e){}
}

/* ================= FX ================= */
function rel(x,y){const r=app.getBoundingClientRect();return[x-r.left,y-r.top];}
function centerOf(el){const r=el.getBoundingClientRect();return[r.left+r.width/2,r.top+r.height/2];}
function sparkle(cx,cy,n=7,ch='✨'){
  const[x,y]=rel(cx,cy);
  for(let k=0;k<n;k++){const e=document.createElement('span');e.className='spark';e.textContent=ch;const a=Math.random()*Math.PI*2,d=30+Math.random()*40;e.style.cssText=`left:${x-11}px;top:${y-11}px;--dx:${Math.cos(a)*d}px;--dy:${Math.sin(a)*d}px`;fx.appendChild(e);setTimeout(()=>e.remove(),850);}
}
function floatText(cx,cy,t){const[x,y]=rel(cx,cy);const e=document.createElement('span');e.className='float';e.textContent=t;e.style.left=(x-30)+'px';e.style.top=(y-30)+'px';fx.appendChild(e);setTimeout(()=>e.remove(),1000);}
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;fx.appendChild(e);setTimeout(()=>e.remove(),1550);}
function flakes(n){let s='';for(let k=0;k<n;k++){const sz=3+Math.random()*5;s+=`<i class="flake" style="left:${Math.random()*100}%;width:${sz}px;height:${sz}px;animation-duration:${4+Math.random()*5}s;animation-delay:${-Math.random()*8}s"></i>`;}return s;}
function confetti(n){const C=['#ff5a5f','#ffd166','#06d6a0','#118ab2','#ff8fab','#fff'];let s='';for(let k=0;k<n;k++)s+=`<i class="conf" style="left:${Math.random()*100}%;background:${C[k%C.length]};animation-duration:${3+Math.random()*4}s;animation-delay:${-Math.random()*6}s;transform:rotate(${Math.random()*360}deg)"></i>`;return s;}
function buzz(){try{navigator.vibrate&&navigator.vibrate(150)}catch(e){}}

/* ================= MODAL ================= */
function modal(html){const w=document.createElement('div');w.className='mwrap';w.innerHTML=`<div class="mcard">${html}</div>`;modalEl.appendChild(w);return w;}
function closeModal(w){if(w&&w.parentNode)w.remove();}

function icicles(){let d='M0 0';const n=16,w=400/n;for(let i=0;i<n;i++){const x=i*w,h=18+rnd(30);d+=` L${x+w*.3} 0 L${x+w*.5} ${h} L${x+w*.7} 0`;}d+=' L400 0Z';return `<svg class="icicles" viewBox="0 0 400 60" preserveAspectRatio="none"><path d="${d}" fill="#dff3ff" stroke="#9cc9e8" stroke-width="1.5"/></svg>`;}
const ICI=icicles();
let lastFixed=-1;
function renderHome(){
  tickHearts();
  $('#coinV').textContent=G.coins.toLocaleString();
  $('#heartV').textContent=G.hearts;
  $('#starV').textContent=G.stars;
  updateHeartTimer();
  $('#avatar').innerHTML=person('mom',look({id:'mom',mood:'happy'}),'20 20 60 60');
  $('#kidFace').innerHTML=person('kid',look({id:'kid',mood:G.done>=3?'happy':'cry'}),'20 18 60 62');
  const done=G.done,total=TASKS.length;
  $('#helpBar').style.width=(done/total*100)+'%';
  $('#helpTxt').textContent=`${done}/${total}`;
  $('#helpLbl').textContent=G.ended?'챕터 1 완료':'도움';
  $('#playBtn').textContent='레벨 '+G.lvl;
  const warm=done>=8;
  let h=`<div class="wall"></div><div class="floor"></div>`;
  if(done<1)h+=ICI;
  if(done>=1)h+=`<div class="glow" style="left:-10%;top:40%;width:60%;height:45%;background:radial-gradient(rgba(255,150,60,.35),transparent 65%)"></div>`;
  if(done>=8)h+=`<div class="glow" style="left:25%;top:0;width:66%;height:50%;background:radial-gradient(rgba(255,230,140,.5),transparent 65%)"></div>`;
  TASKS.forEach((t,i)=>{
    const st=i<done?(t.a&&t.a()):(t.b&&t.b());
    if(st)h+=`<div class="spot${i===lastFixed?' justfixed':''}" style="left:${t.x}%;top:${t.y}%">${st}</div>`;
  });
  const mood=done<1?'cry':done<3?'sad':'happy';
  const H=Math.min(homeEl.clientHeight*.3,270);
  h+=`<div class="roomcast" style="height:${H}px"><div style="height:${H}px;margin-right:${-H*.08}px">${person('mom',look({id:'mom',mood}))}</div><div style="height:${H*.68}px;margin-left:${-H*.08}px">${person('kid',look({id:'kid',mood}))}</div></div>`;
  if(done<3)h+=`<div class="snowin">${flakes(done<1?34:18)}</div>`;
  h+=`<div class="chill" style="opacity:${Math.max(0,.5-done*.06)}"></div>`;
  if(!G.ended&&done<total){
    const t=TASKS[done];const can=G.stars>=t.cost;
    const by=t.b?t.y-6:t.y;
    h+=`<button class="taskbub" id="taskBub" style="left:${t.x}%;top:${Math.max(16,by)}%"><span class="ci">🔨</span><span class="cc">⭐ ${t.cost}</span><span class="nm">${t.n}</span>${can?'<span class="hand">👆</span>':''}</button>`;
  }
  roomEl.innerHTML=h;
  roomEl.classList.toggle('warm',warm);
  lastFixed=-1;
  const tb=$('#taskBub');if(tb)tb.onclick=e=>{e.stopPropagation();tryTask();};
  const canDo=!G.ended&&done<total&&G.stars>=TASKS[done].cost;
  $('#playBtn').classList.toggle('pulse',!canDo);
  $('#helpBtn').classList.toggle('pulse',canDo);
}
function updateHeartTimer(){
  tickHearts();
  $('#heartV').textContent=G.hearts;
  if(G.hearts>=5){$('#heartT').textContent='가득';return;}
  const ms=REGEN-(Date.now()-G.heartT);const m=Math.floor(ms/60000),s=Math.floor(ms%60000/1000);
  $('#heartT').textContent=`${m}:${String(s).padStart(2,'0')}`;
}
setInterval(()=>{if(!homeEl.classList.contains('hidden'))updateHeartTimer();},1000);

function tryTask(){
  sfx('tap');
  if(G.ended||G.done>=TASKS.length)return;
  const t=TASKS[G.done];
  if(G.stars<t.cost){
    const w=modal(`<div class="mt">⭐이 부족해요</div><p>「${t.n}」에는 ⭐ ${t.cost}개가 필요해요.<br>포장마차 장사(레벨)를 해서 별을 모아 주세요!</p><div class="row"><button class="big gray" data-x>닫기</button><button class="big green" data-p>레벨 ${G.lvl} 하러 가기</button></div>`);
    w.querySelector('[data-x]').onclick=()=>closeModal(w);
    w.querySelector('[data-p]').onclick=()=>{closeModal(w);startLevel();};
    return;
  }
  runTask(G.done);
}
function runTask(i){
  const t=TASKS[i];

}

function setBg(b){stage.className='stage bg-'+(b==='pocha'?'snow':b);decor.innerHTML=DECOR[b]?DECOR[b]():'';}
function setMode(m){sceneEl.dataset.mode=m;}
function setMoods(o){for(const k in o){const x=curCast.find(y=>y.id===k);if(x)x.mood=o[k];}}
function showScene(){sceneEl.classList.remove('hidden');}
function hideScene(){sceneEl.classList.add('hidden');sui.innerHTML='';castEl.innerHTML='';talkHandler=null;}
function castBottom(mode,H){return {talk:150,choice:H*.34+30,clean:40,dress:H*.43,ending:H*.47}[mode]??150;}
function renderCast(list,speaker){
  if(list)curCast=list;
  curSpeaker=speaker||null;
  const H=sceneEl.clientHeight||app.clientHeight,W=sceneEl.clientWidth||app.clientWidth,mode=sceneEl.dataset.mode,bottom=castBottom(mode,H);
  stage.style.setProperty('--fl',(bottom+26)+'px');
  castEl.style.bottom=bottom+'px';
  const top=mode==='clean'?110:mode==='choice'?110:mode==='dress'?40:60;
  const nA=curCast.filter(x=>x.id!=='kid').length,nK=curCast.length-nA;
  let h=Math.min(H-bottom-top,mode==='clean'?520:360);
  if(curCast.length)h=Math.min(h,W*.97/(.42*(nA+.68*nK)));
  h=Math.max(h,110);
  castEl.innerHTML=curCast.map(x=>{
    const hh=x.id==='kid'?h*.68:h;
    const cls=speaker?(speaker===x.id?'speak':'dim'):'';
    return `<div class="ch ${cls}" style="height:${hh}px;margin:0 ${-h*.085}px">${person(x.id,look(x))}</div>`;
  }).join('');
}
function runTalk(lines,cb){
  if(!lines||!lines.length){cb();return;}
  setMode('talk');
  sui.innerHTML=`<button class="skip">건너뛰기 ▶▶</button><div class="dlg"><div class="who"></div><div class="txt"></div><div class="nx">▼</div></div>`;
  const dlg=sui.querySelector('.dlg'),who=sui.querySelector('.who'),txt=sui.querySelector('.txt');
  let i=-1,typing=null,full='';
  const apply=l=>{const o=l[2];if(!o)return;if(o.bg)setBg(o.bg);if(o.cast)curCast=o.cast.map(x=>({...x}));const m={...o};delete m.bg;delete m.cast;setMoods(m);};
  const finish=()=>{clearInterval(typing);typing=null;talkHandler=null;cb();};
  function next(){
    if(typing){clearInterval(typing);typing=null;txt.textContent=full;return;}
    i++;if(i>=lines.length){finish();return;}
    const l=lines[i];apply(l);renderCast(null,l[0]||null);
    dlg.classList.toggle('narr',!l[0]);
    if(l[0]){who.textContent=CH[l[0]].name;who.style.background=CH[l[0]].col;}
    full=l[1];let n=0;txt.textContent='';
    typing=setInterval(()=>{n++;txt.textContent=full.slice(0,n);if(n>=full.length){clearInterval(typing);typing=null;}},26);
  }
  sui.querySelector('.skip').onclick=e=>{e.stopPropagation();for(i++;i<lines.length;i++)apply(lines[i]);renderCast(null,null);finish();};
  talkHandler=next;next();
}
sceneEl.addEventListener('click',e=>{if(talkHandler&&sceneEl.dataset.mode==='talk'&&!e.target.closest('button'))talkHandler();});

function showFail(text,retry){
  buzz();sfx('fail');
  const ov=document.createElement('div');ov.className='failov';
  const fc=['mom','kid'].map(id=>`<div style="height:${id==='kid'?120:176}px;margin:0 -14px">${person(id,look({id,mood:'cry'}))}</div>`).join('');
  ov.innerHTML=`<div class="fc">${fc}</div><h1>실패…</h1><p>${text}</p><button class="big">↺ 다시 도전하기</button>`;
  ov.querySelector('button').onclick=()=>{ov.remove();retry();};
  sui.appendChild(ov);
}

function runSeq(steps,done,taskIdx){
  let k=-1;
  const next=()=>{
    k++;if(k>=steps.length){done();return;}
    const s=steps[k];
    sui.innerHTML='';
    if(s.talk){setBg(s.bg||'room');curCast=(s.cast||[]).map(x=>({...x}));runTalk(s.talk,next);}
    else if(s.choice)choiceStep(s.choice,next);
    else if(s.clean)cleanStep(next);
    else if(s.dress)dressStep(next);
    else if(s.fix)fixStep(taskIdx,next);
    else if(s.ending)endStep(next);
    else next();
  };
  next();
}
function fixStep(i,next){
  if(i==null||i!==G.done){next();return;}
  const t=TASKS[i];
  G.stars-=t.cost;G.done++;save();
  lastFixed=i;
  setBg('room');setMode('talk');castEl.innerHTML='';sui.innerHTML='';
  sceneEl.classList.add('hidden');homeEl.classList.remove('scening');
  renderHome();bumpRes('#starRes');sfx('buy');
  const r=homeEl.getBoundingClientRect();
  const cx=r.left+r.width*t.x/100,cy=r.top+r.height*t.y/100;

/* ================= PUZZLE ENGINE ================= */
const locked=g=>g.lock>0||!!(g.req&&g.req.some(r=>r.n>0));
const cloneGs=gs=>{const c=gs.map(g=>({lock:g.lock,sauce:g.sauce,req:g.req?g.req.map(r=>({t:r.t,n:r.n})):null,layers:g.layers.map(l=>l.map(it=>it?{t:it.t,ice:it.ice}:null))}));c.rail=(gs.rail||[]).map(r=>({t:r.t,x:r.x,id:r.id}));return c;};
const countItems=gs=>{let n=(gs.rail||[]).length;gs.forEach(g=>g.layers.forEach(l=>l.forEach(it=>{if(it)n++;})));return n;};
const isTriple=l=>l[0]&&l[1]&&l[2]&&l[0].t===l[1].t&&l[1].t===l[2].t&&!l[0].ice&&!l[1].ice&&!l[2].ice;
function afterMatch(gs,t){gs.forEach(g=>{g.layers.forEach(l=>l.forEach(it=>{if(it&&it.ice)it.ice--;}));if(g.lock>0)g.lock--;if(g.req)g.req.forEach(r=>{if(r.t===t&&r.n>0)r.n--;});});}
function resolve(gs){
  const ev={matched:[],popped:[],unlocked:[]};
  let changed=true,guard=0;
  while(changed&&guard++<60){
    changed=false;
    gs.forEach((g,i)=>{if(locked(g))return;const f=g.layers[0];if(isTriple(f)){const t=f[0].t;ev.matched.push({g:i,t});g.layers[0]=[null,null,null];changed=true;const before=gs.map(locked);afterMatch(gs,t);gs.forEach((x,j)=>{if(before[j]&&!locked(x))ev.unlocked.push(j);});}});
    gs.forEach((g,i)=>{if(locked(g))return;if(g.layers[0].every(x=>!x)&&g.layers.length>1){g.layers.shift();ev.popped.push(i);changed=true;}});
  }
  return ev;
}
const canPick=(gs,g,p)=>{if(g===-1)return !!(gs.rail&&gs.rail[p]);const x=gs[g];if(!x||locked(x))return false;const it=x.layers[0][p];return !!(it&&!it.ice);};
const canDrop=(gs,g,p)=>{if(g<0)return false;const x=gs[g];return !!x&&!locked(x)&&!x.layers[0][p];};
function doMove(gs,a,b){let it;if(a.g===-1){it={t:gs.rail[a.p].t,ice:0};gs.rail.splice(a.p,1);}else{it=gs[a.g].layers[0][a.p];gs[a.g].layers[0][a.p]=null;}gs[b.g].layers[0][b.p]=it;}
function bestMove(gs){
  const src=[],dst=[];
  gs.forEach((g,gi)=>{if(locked(g))return;g.layers[0].forEach((it,p)=>{if(it&&!it.ice)src.push({g:gi,p,t:it.t});else if(!it)dst.push({g:gi,p});});});
  (gs.rail||[]).forEach((r,i)=>src.push({g:-1,p:i,t:r.t,id:r.id}));
  if(!src.length||!dst.length)return null;
  const cnt=gi=>gi<0?1.5:gs[gi].layers[0].filter(Boolean).length;
  const typesIn=(gi,t)=>gi<0?0:gs[gi].layers[0].filter(x=>x&&x.t===t).length;
  for(const d of dst){const items=gs[d.g].layers[0].filter(Boolean);if(items.length===2&&items[0].t===items[1].t&&!items[0].ice&&!items[1].ice){const t=items[0].t;const cs=src.filter(s=>s.t===t&&s.g!==d.g);if(cs.length){cs.sort((a,b)=>cnt(a.g)-cnt(b.g));return{a:cs[0],b:d};}}}
  for(const d of dst){const items=gs[d.g].layers[0].filter(Boolean);if(items.length===1&&!items[0].ice){const t=items[0].t;const cs=src.filter(s=>s.t===t&&s.g!==d.g&&typesIn(s.g,t)<2);if(cs.length){cs.sort((a,b)=>cnt(a.g)-cnt(b.g));return{a:cs[0],b:d};}}}
  const ss=src.filter(s=>typesIn(s.g,s.t)<2).sort((a,b)=>cnt(a.g)-cnt(b.g));
  for(const s of ss){const ds=dst.filter(d=>d.g!==s.g);if(ds.length){ds.sort((a,b)=>cnt(a.g)-cnt(b.g));const pref=ds.find(d=>typesIn(d.g,s.t)>0);return{a:s,b:pref||ds[ds.length-1]};}}

}
function solvable(gs){const s=cloneGs(gs);for(let i=0;i<1200;i++){if(countItems(s)===0)return true;const m=bestMove(s);if(!m)return false;doMove(s,m.a,m.b);resolve(s);}return false;}
// 스테이지 종류: 5의 배수(10~) = 매운맛 하드, 끝자리 3·8(8~) = 레일
function stageType(n){if(n>=10&&n%5===0)return 'hard';if(n>=8&&n%5===3)return 'rail';return 'normal';}
function levelCfg(n){
  const T=[[6,4,8],[6,5,10],[9,6,13],[9,7,15],[9,7,16],[12,8,18],[12,8,20],[12,9,21],[12,10,22],[12,10,24]];
  let[grills,types,sets]=T[Math.min(n-1,T.length-1)];
  if(n>10){sets=Math.min(30,24+Math.floor((n-10)/2));types=Math.min(12,10+Math.floor((n-10)/3));}
  const stage=stageType(n);
  let locks=n>=4?(n>=8?2:1):0,ice=n>=5?Math.min(6,n-3):0,iron=n>=7?1:0,sauce=0,rail=0;
  if(iron&&locks>0)locks--;
  // 하드: 양념 판 + 세트·시간 압박에, 장치는 한 판에 하나만 (얼음 → 주문 철판 → 뚜껑 순서로 돌아가며)
  if(stage==='hard'){sets=Math.round(sets*1.2);sauce=Math.round(grills/3);ice=0;locks=0;iron=0;const k=Math.floor(n/5)%3;if(k===2)ice=4;else if(k===0)iron=1;else locks=1;}
  if(stage==='rail'){grills=Math.min(grills,9);rail=1;}
  let time=Math.round(50+sets*7);if(stage==='hard')time=Math.round(time*.85);if(rail)time+=15;
  return{n,stage,grills,types,sets,locks,ice,iron,sauce,rail,orders:n>=3,time};
}
function genLevel(cfg){
  let last=null;
  for(let att=0;att<120;att++){
    const u=unlockedCount(cfg.n),newest=MENU_ORDER[u-1];
    const typesSel=[newest,...shuffle(MENU_ORDER.slice(0,u-1)).slice(0,Math.min(cfg.types,u)-1)];
    const pool=[];for(let s=0;s<cfg.sets;s++){const t=typesSel[s%typesSel.length];pool.push(t,t,t);}shuffle(pool);
    const N=cfg.grills;const gs=Array.from({length:N},()=>({lock:0,sauce:false,req:null,layers:[[null,null,null]]}));
    gs.rail=[];
    if(cfg.rail){const rn=Math.round(pool.length*.3);for(let i=0;i<rn;i++)gs.rail.push({t:pool.pop(),x:i,id:i+1});}
    const E=(N<=6?4:N<=9?5:6)+(cfg.rail?1:0);
    const frontCount=Math.min(pool.length,N*3-E);
    shuffle([...Array(N*3).keys()]).slice(0,frontCount).forEach(si=>{gs[Math.floor(si/3)].layers[0][si%3]={t:pool.pop(),ice:0};});
    let gi=rnd(N),guard=0;
    while(pool.length&&guard++<500){const g=gs[gi%N];if(g.layers.length<7){const k=Math.min(pool.length,2+(Math.random()<.5?1:0));const layer=[null,null,null];shuffle([0,1,2]).slice(0,k).forEach(p=>{layer[p]={t:pool.pop(),ice:0};});g.layers.push(layer);}gi+=1+rnd(2);}
    gs.forEach(g=>{while(g.layers[0].every(x=>!x)&&g.layers.length>1)g.layers.shift();});
    if(gs.some(g=>isTriple(g.layers[0])))continue;
    const order=shuffle(gs.map((g,i)=>i));let li=0;
    for(let k=0;k<cfg.locks&&li<N;k++)gs[order[li++]].lock=3+k*3;
    for(let k=0;k<cfg.iron&&li<N;k++){
      const gk=order[li++],cnts={};
      gs.forEach((g,j)=>{if(j===gk)return;g.layers.forEach(l=>l.forEach(it=>{if(it)cnts[it.t]=(cnts[it.t]||0)+1;}));});
      gs.rail.forEach(r=>cnts[r.t]=(cnts[r.t]||0)+1);
      const ok=shuffle(Object.keys(cnts).map(Number).filter(t=>cnts[t]>=3));
      const req=ok.slice(0,Math.min(ok.length,Math.random()<.5?2:1)).map(t=>({t,n:1}));
      gs[gk].req=req.length?req:null;
    }
    if(cfg.ice){const fr=[];gs.forEach(g=>{if(locked(g))return;g.layers[0].forEach(it=>{if(it)fr.push(it);});});shuffle(fr).slice(0,cfg.ice).forEach(it=>it.ice=2);}
    if(cfg.sauce)shuffle(gs.filter(g=>!locked(g)&&g.layers.length>1)).slice(0,cfg.sauce).forEach(g=>g.sauce=true);
    last=gs;
    if(solvable(gs))return gs;
  }
  return last;
}

  w.querySelector('[data-q]').onclick=()=>{closeModal(w);stopLevel();loseHeart();failPopup();};
}
$('#pauseBtn').onclick=()=>{
  if(!L||!L.running)return;sfx('tap');L.paused=true;
  const w=modal(`<div class="mt">일시 정지</div><p>LV ${L.n} · 🍽️ ${L.served}/${L.cfg.sets}</p><div class="row" style="flex-direction:column"><button class="big green" data-c>계속하기</button><button class="big gray" data-q>그만두기 (❤️ -1)</button></div>`);
  w.querySelector('[data-c]').onclick=()=>{closeModal(w);L.paused=false;};
  w.querySelector('[data-q]').onclick=()=>{closeModal(w);stopLevel();loseHeart();backHome();};
};
document.querySelectorAll('.bst').forEach(b=>b.onclick=()=>useBooster(b.dataset.b));
function useBooster(k){
  if(!L||!L.running||L.busy)return;
  if(G.boost[k]>0)G.boost[k]--;
  else if(G.coins>=BCOST[k]){G.coins-=BCOST[k];}
  else{toast('🪙 코인이 부족해요');sfx('err');return;}
  save();updBoosters();sfx('buy');clearHints();L.sel=null;
  if(k==='hint'){
    const m=bestMove(L.gs);
    if(!m){toast('움직일 수 있는 게 없어요');renderBoard();return;}
    renderBoard();renderRail();srcEl(m.a)?.classList.add('hintsrc');slotEl(m.b.g,m.b.p)?.classList.add('hintdst');showHand(m.a,m.b,false);
  }else if(k==='time'){L.time+=30;updLevelHud();toast('⏰ +30초!');}
  else if(k==='shuffle'){
    const pos=[];L.gs.forEach((g,gi)=>{if(locked(g))return;g.layers[0].forEach((it,p)=>{if(it&&!it.ice)pos.push({g:gi,p,it});});});
    let best=null,bs=-1;
    for(let t=0;t<40;t++){const items=shuffle(pos.map(x=>x.it));const tmp=cloneGs(L.gs);pos.forEach((x,i)=>{tmp[x.g].layers[0][x.p]={t:items[i].t,ice:0};});
      let sc=0;tmp.forEach(g=>{if(locked(g))return;const f=g.layers[0].filter(Boolean);const m={};f.forEach(i=>m[i.t]=(m[i.t]||0)+1);Object.values(m).forEach(v=>{if(v>=3)sc+=10;else if(v===2)sc+=2;});});
      if(sc>bs){bs=sc;best=items;}}
    pos.forEach((x,i)=>{L.gs[x.g].layers[0][x.p]={t:best[i].t,ice:0};});
    renderBoard({rise:L.gs.map((_,i)=>i)});toast('🔄 섞었어요!');
    L.busy=true;setTimeout(()=>{L.busy=false;afterAuto();},380);
  }else if(k==='bag'){
    const m={};L.gs.forEach(g=>{if(locked(g))return;g.layers[0].forEach(it=>{if(it)m[it.t]=(m[it.t]||0)+1;});});
    let t=-1,mx=0;for(const x in m)if(m[x]>mx){mx=m[x];t=+x;}
    if(t<0){L.gs.forEach(g=>g.layers.forEach(l=>l.forEach(it=>{if(it&&t<0)t=it.t;})));}
    let need=3;
    const take=(onlyFront)=>{L.gs.forEach((g,gi)=>{if(onlyFront&&locked(g))return;(onlyFront?[g.layers[0]]:g.layers).forEach(l=>l.forEach((it,p)=>{if(need>0&&it&&it.t===t){const s=onlyFront?slotEl(gi,p):null;if(s){const[x,y]=centerOf(s);sparkle(x,y,5);}l[p]=null;need--;}}));});};
    take(true);for(let i=L.gs.rail.length-1;i>=0&&need>0;i--)if(L.gs.rail[i].t===t){L.gs.rail.splice(i,1);need--;}if(need>0)take(false);
    L.served++;afterMatch(L.gs,t);orderMatched(t,false);renderRail();
    toast(`🛍️ ${FOODS[t].n} 포장 완료!`);
    L.busy=true;setTimeout(()=>{L.busy=false;afterAuto();},300);
  }
}
function afterAuto(){
  const ev=resolve(L.gs);
  if(ev.matched.length){L.served+=ev.matched.length;sfx('match');ev.matched.forEach(m=>orderMatched(m.t,L.gs[m.g].sauce));}
  L.gs.forEach(g=>{while(!locked(g)&&g.layers[0].every(x=>!x)&&g.layers.length>1)g.layers.shift();});
  renderBoard({rise:ev.popped,unlocked:ev.unlocked});updLevelHud();checkEnd();
}

const CUST=['grandma','office','student','kid','worker','nurse','police'];
const npcImg=(k,e)=>`<img src="${(NPC[k]||NPC.office)[e]}" alt="">`;
function typeCounts(){const m={};L.gs.forEach(g=>g.layers.forEach(l=>l.forEach(it=>{if(it)m[it.t]=(m[it.t]||0)+1;})));(L.gs.rail||[]).forEach(r=>m[r.t]=(m[r.t]||0)+1);return m;}
function spawnOrder(){
  const m=typeCounts(),types=shuffle(Object.keys(m).map(Number).filter(t=>m[t]>=3));
  if(!types.length||L.cfg.sets-L.served<3)return false;
  const deliv=types.length>=2&&Math.random()<.4;
  const sauceOk=L.gs.some(g=>g.sauce&&!locked(g));
  const items=types.slice(0,deliv?2:1).map(t=>({t,need:(!deliv&&m[t]>=6&&Math.random()<.45)?2:1,got:0,sauce:sauceOk&&Math.random()<.5}));
  const sets=items.reduce((a,x)=>a+x.need,0),dur=14+sets*9+(deliv?4:0);
  L.order={who:deliv?'rider':CUST[rnd(CUST.length)],deliv,items,dur,left:dur,done:false};
  renderOrder(true);sfx('bell');return true;
}
function renderOrder(fresh){
  const el=$('#order'),o=L&&L.order;
  if(!o){el.classList.add('hidden');el.innerHTML='';return;}
  if(fresh||!el.firstChild){
    el.classList.remove('hidden','leave');
    el.innerHTML=`<div class="cust"><span class="cu">${npcImg(o.who,'dot')}</span></div><div class="ob"><div class="oi">${o.items.map((x,i)=>`<b data-i="${i}" class="${x.sauce?'sc':''}">${x.sauce?'<u>🌶️</u>':''}<i>${FOOD_SVG[x.t]}</i><em></em></b>`).join('')}</div><div class="obot"><span class="obar"><i></i></span><s class="otime"></s></div><button class="ox" title="주문 거절">✕</button></div>`;
    el.querySelector('.ox').onclick=e=>{e.stopPropagation();if(L&&L.order&&!L.order.done&&L.running)finishOrder(false);};
  }
  o.items.forEach((x,i)=>{const b=el.querySelector(`b[data-i="${i}"]`);if(!b)return;b.classList.toggle('ok',x.got>=x.need);b.querySelector('em').textContent=x.got>=x.need?'✔':`×${x.need-x.got}`;});
  const bar=el.querySelector('.obar i');if(bar)bar.style.transform=`scaleX(${Math.max(0,o.left/o.dur)})`;
  const tt=el.querySelector('.otime');if(tt){const t=Math.max(0,Math.ceil(o.left));tt.textContent=`${Math.floor(t/60)}:${String(t%60).padStart(2,'0')}`;}
  el.classList.toggle('hurry',o.left<5&&!o.done);
}
function orderMatched(t,sauced){
  const o=L&&L.order;if(!o||o.done)return;
  const x=o.items.find(y=>y.t===t&&!!y.sauce===!!sauced&&y.got<y.need);if(!x)return;
  x.got++;renderOrder();
  if(o.items.every(y=>y.got>=y.need))finishOrder(true);
}
function finishOrder(ok){
  const o=L&&L.order;if(!o||o.done)return;o.done=true;
  const el=$('#order'),cu=el.querySelector('.cu'),[x,y]=centerOf(el);
  if(ok){const sets=o.items.reduce((a,q)=>a+q.need,0),coins=20*sets+(o.deliv?20:0);G.coins+=coins;L.time+=8;save();updLevelHud();if(cu)cu.innerHTML=npcImg(o.who,'smile');sparkle(x,y,10,'🪙');floatText(x,y+34,`주문 완료! 🪙+${coins} ⏰+8초`);sfx('ok');}
  else{if(cu)cu.innerHTML=npcImg(o.who,'angry');floatText(x,y+34,'손님이 떠났어요…');sfx('err');}
  renderOrder();
  const me=L;
  setTimeout(()=>{if(L===me&&L.order===o)el.classList.add('leave');},650);
  setTimeout(()=>{if(L===me&&L.order===o){L.order=null;renderOrder();L.nextOrder=L.elapsed+(L.cfg.stage==='hard'?6+Math.random()*16:10+Math.random()*8);}},1150);
}

/* ================= 레일 스테이지 ================= */
const RSP=64;let railRaf=0;
function renderRail(){
  const box=$('#railbox'),wrap=$('#ritems');
  if(!L||!L.cfg.rail){box.classList.add('hidden');wrap.innerHTML='';return;}
  box.classList.remove('hidden');
  const have=new Map([...wrap.children].map(e=>[+e.dataset.id,e]));
  L.gs.rail.forEach(r=>{if(!have.has(r.id)){const e=document.createElement('div');e.className='ritem';e.dataset.id=r.id;e.innerHTML=FOOD_SVG[r.t];wrap.appendChild(e);}have.delete(r.id);});
  have.forEach(e=>e.remove());
  wrap.querySelectorAll('.ritem').forEach(e=>e.classList.toggle('sel',!!(L.sel&&L.sel.g===-1&&L.sel.id===+e.dataset.id)));
  placeRail();
  if(!railRaf)railRaf=requestAnimationFrame(railTick);
}
function placeRail(){
  if(!L||!L.cfg.rail)return;
  const W=$('#railbox').clientWidth||360,len=Math.max(W+RSP,(L.railTotal||1)*RSP),pos=L.rpos||0;
  $('#ritems').querySelectorAll('.ritem').forEach(e=>{const r=L.gs.rail.find(q=>q.id===+e.dataset.id);if(!r)return;const x=((r.x*RSP+pos)%len+len)%len-RSP;e.style.transform=`translateX(${x}px)`;});
  $('#belt').style.backgroundPosition=`${pos}px 0`;
}
function railTick(now){
  if(!L||!L.cfg.rail){railRaf=0;return;}
  railRaf=requestAnimationFrame(railTick);
  const dt=Math.min(.05,(now-(L.rt||now))/1000);L.rt=now;
  if(L.running&&!L.paused)L.rpos=(L.rpos||0)+dt*30;
  placeRail();
}
$('#ritems').addEventListener('pointerdown',e=>{
  if(!L||!L.running||L.busy||L.paused)return;
  const el=e.target.closest('.ritem');if(!el)return;
  const id=+el.dataset.id,r=L.gs.rail.find(q=>q.id===id);if(!r)return;
  e.preventDefault();
  if(!(L.sel&&L.sel.g===-1&&L.sel.id===id)){sfx('pick');document.querySelectorAll('.slot.sel,.ritem.sel').forEach(x=>x.classList.remove('sel'));el.classList.add('sel');}
  drag={g:-1,p:-1,id,t:r.t,x0:e.clientX,y0:e.clientY,moved:false,ghost:null,el,pid:e.pointerId};
});

addEventListener('resize',()=>{if(!sceneEl.classList.contains('hidden'))renderCast(null,curSpeaker);if(!homeEl.classList.contains('hidden'))renderHome();});
renderHome();
showTitle();
})();
</script>
</body>
