<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>거지모녀 캐릭터 시트 프롬프트</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3ead9;color:#3b2a20;font:15px/1.5 system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
header{position:sticky;top:0;z-index:5;background:#e8d9bf;border-bottom:1px solid #cbb48f;padding:10px 12px}
h1{font-size:16px;margin:0 0 6px}
.note{font-size:12.5px;color:#6b5240;margin:0 0 8px}
.tabs{display:flex;gap:6px;margin-bottom:6px;flex-wrap:wrap}
.tabs button{background:#fffaf0;color:#3b2a20;border:1px solid #cbb48f;border-radius:999px;padding:4px 11px;font-size:13px}
.tabs button.on{background:#7a4f35;color:#fff;border-color:#7a4f35}
nav{display:flex;flex-wrap:wrap;gap:6px}
nav a{font-size:12.5px;text-decoration:none;color:#3b2a20;background:#fffaf0;border:1px solid #cbb48f;border-radius:999px;padding:3px 9px}
nav a.done{opacity:.55}
main{padding:12px;max-width:820px;margin:0 auto}
.card{background:#fffaf0;border:1px solid #d8c4a2;border-radius:10px;margin:0 0 14px;overflow:hidden;scroll-margin-top:150px}
.hd{display:flex;align-items:center;gap:8px;padding:9px 12px;background:#efe2c9}
.hd b{flex:1;font-size:15px}
.tag{font-size:11px;padding:2px 7px;border-radius:999px;background:#c97b4a;color:#fff}
.tag.done{background:#8a9a6b}
button{font:inherit;font-size:13px;border:0;border-radius:7px;background:#7a4f35;color:#fff;padding:6px 12px;cursor:pointer}
button.ok{background:#8a9a6b}
pre{margin:0;padding:10px 12px;white-space:pre-wrap;word-break:break-word;font:12.5px/1.5 ui-monospace,Menlo,Consolas,monospace;color:#3b2a20}
details summary{cursor:pointer;padding:8px 12px;font-size:13px;color:#6b5240}
.sec-note{font-size:12.5px;color:#6b5240;margin:0 0 12px}
</style></head><body>
<header>
<h1>에셋 프롬프트</h1>
<p class="note">탭마다 첨부할 그림이 다릅니다(탭 안 안내 참고). 복사 버튼을 누르면 프롬프트 전체가 복사됩니다.</p>
<div class="tabs" id="tabs"></div>
<nav id="nav"></nav>
</header>
<main id="list"></main>
<script>
const P=/*DATA*/;
const W='웨스 앤더슨풍 가게 그림(처음 마음에 드셨던 파스텔 가게 앞 하윤 그림)을 첫 번째로 첨부해 주세요.';
const NOTES={'메인':W+' 그 뒤에 하윤 B·별이 B 시트를 첨부하면 얼굴과 옷이 맞습니다.','CG':W+' 그 뒤에 그 장면에 나오는 캐릭터 시트를 첨부하면 얼굴과 옷이 맞습니다.','배경':W,'방':W+' 전·후 두 개가 한 장에 나오도록 짰습니다.','옷':'하윤 A 시트를 같이 첨부해 주세요.','손님':'하윤 A 시트를 같이 첨부해 주세요.','캐릭터':'하윤 A 시트를 같이 첨부해 주세요.'};
const secs=[...new Set(P.map(p=>p.sec))];
let cur=secs.find(s=>P.some(p=>p.sec===s&&!p.done))||secs[0];
try{const v=localStorage.getItem('pp_sec');if(v&&secs.includes(v))cur=v}catch(e){}
const tabs=document.getElementById('tabs'),nav=document.getElementById('nav'),list=document.getElementById('list');
function copy(txt,btn){
  const done=()=>{btn.textContent='복사됨';btn.classList.add('ok');setTimeout(()=>{btn.textContent='복사';btn.classList.remove('ok')},1500)};
  const fb=()=>{const ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy')}catch(e){}ta.remove();done()};
  try{navigator.clipboard.writeText(txt).then(done,fb)}catch(e){fb()}
}
function render(){
  tabs.innerHTML='';secs.forEach(s=>{const b=document.createElement('button');const n=P.filter(p=>p.sec===s&&!p.done).length;b.textContent=s+(n?` (${n})`:' ✓');if(s===cur)b.className='on';b.onclick=()=>{cur=s;try{localStorage.setItem('pp_sec',s)}catch(e){};render();window.scrollTo(0,0)};tabs.appendChild(b)});
  nav.innerHTML='';list.innerHTML='';
  if(NOTES[cur]){const p=document.createElement('p');p.className='sec-note';p.textContent=NOTES[cur];list.appendChild(p)}
  P.filter(p=>p.sec===cur).sort((a,b)=>a.done-b.done).forEach(p=>{
    const a=document.createElement('a');a.href='#'+p.id;a.textContent=p.name;if(p.done)a.className='done';nav.appendChild(a);
    const c=document.createElement('section');c.className='card';c.id=p.id;
    const hd=document.createElement('div');hd.className='hd';
    const b=document.createElement('b');b.textContent=p.name;
    const tg=document.createElement('span');tg.className='tag'+(p.done?' done':'');tg.textContent=p.done?'완료':'남음';
    const bt=document.createElement('button');bt.textContent='복사';bt.onclick=()=>copy(p.t,bt);
    hd.append(b,tg,bt);c.appendChild(hd);
    const pre=document.createElement('pre');pre.textContent=p.t;
    if(p.done){const d=document.createElement('details');const s=document.createElement('summary');s.textContent='프롬프트 보기';d.append(s,pre);c.appendChild(d)}
    else c.appendChild(pre);
    list.appendChild(c);
  });
}
render();
</script>
</body></html>
